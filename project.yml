name: HearMeOut
options:
  bundleIdPrefix: uk.george-hall
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  HearMeOutCore:
    path: Packages/HearMeOutCore
  WhisperKit:
    # Same version as Let's Meet Note Taker, so its downloaded Core ML models load unchanged.
    url: https://github.com/argmaxinc/WhisperKit.git
    exactVersion: 1.1.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HearMeOut:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: HearMeOutCore
      - package: WhisperKit
        product: WhisperKit
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Hear Me Out
        CFBundleDisplayName: Hear Me Out
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© George Hall"
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: Hear Me Out records voice notes from the microphone you choose. Recording only starts when you press Record.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mpeg-4-audio, public.mp3, com.microsoft.waveform-audio, org.xiph.flac, public.aiff-audio]
    entitlements:
      path: App/HearMeOut.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.george-hall.hearmeout
        PRODUCT_NAME: Hear Me Out
        EXECUTABLE_NAME: HearMeOut
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        DEVELOPMENT_TEAM: ""
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  HearMeOut:
    build:
      targets:
        HearMeOut: all
    run:
      config: Debug
